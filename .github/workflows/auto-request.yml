# ダッシュボード（wajitanaka-dashboard）の改修依頼を10分おきに見て自動対応する。
# Claude は石田さんのプランの鍵（CLAUDE_CODE_OAUTH_TOKEN）で動かし、API料金はかけない。
# AIにはファイルの読み書きだけを許可し、ビルド・push・公開・変更範囲チェックは .github/auto/run.mjs が行う。
name: 改修依頼の自動対応

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: auto-request
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - run: node .github/auto/run.mjs
        env:
          AGENT_KEY: ${{ secrets.WAJITANAKA_AGENT_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
